<!DOCTYPE html>

<html lang="pt">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Reservas — Sushi Sabores do Mundo</title>
    <link rel="shortcut icon" href="img/images/logo.webp" type="image/x-webp">
    <meta
        content="Sushi Sabores do Mundo, do Chef José Centeio (Guto), em Palmarejo Baixo, Praia, Cabo Verde. Conheça a história e solicite uma reserva."
        name="description" />
    <meta content="website" property="og:type" />
    <meta content="Reservas — Sushi Sabores do Mundo" property="og:title" />
    <meta content="Sushi feito com alma, de Cabo Verde ao Japão." property="og:description" />
    <meta content="img/images/02.webp" property="og:image" />
    <meta content="#171411" name="theme-color" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="css/style.css" rel="stylesheet" />
    <script defer="" src="js/main.js"></script>
</head>

<body data-page="booking">
    <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">寿</span><span>SUSHI
                <b>SABORES DO MUNDO</b><small>CHEF JOSÉ CENTEIO · GUTO</small></span></a><button aria-expanded="false"
            aria-label="Abrir menu" data-i18n-aria-label="openMenu" class="nav-toggle">☰</button>
        <nav class="main-nav"><a data-i18n="navHome" href="index.html">Início</a><a data-i18n="navStory"
                href="historia.html">Nossa história</a><a data-i18n="navChef" href="chef.html">O Chef Guto</a><a
                data-i18n="navJapan" href="japao.html">Japão &amp; experiência</a><a data-i18n="navMenu"
                href="menu.html">Menu</a><a data-i18n="navBooking" href="reservas.html">Reservas</a><a
                data-i18n="navContact" href="contacto.html">Contacto</a></nav><label class="language-picker"><span
                class="sr-only"><span data-i18n="languageLabel"></span></span><select id="language">
                <option value="pt">PT</option>
                <option value="en">EN</option>
                <option value="fr">FR</option>
                <option value="ja">日本語</option>
            </select></label>
    </header>
    <main>
        <section class="page-hero"><span class="eyebrow"><span data-i18n="bookingEyebrow"></span></span>
            <h1 data-i18n="bookingTitle"></h1>
            <p class="lead" data-i18n="bookingIntro"></p>
        </section>
        <section class="section booking-layout">
            <form class="booking-form" id="booking-form">
                <fieldset>
                    <legend data-i18n="chooseTable"></legend>
                    <div class="table-list" id="table-list"></div>
                </fieldset><label data-i18n="name" for="customer-name"></label><input autocomplete="name"
                    id="customer-name" name="name" placeholder="Nome" data-i18n-placeholder="name" required="" /><label
                    data-i18n="people" for="party-size"></label><input id="party-size" max="30" min="1" name="people"
                    required="" type="number" value="2" /><button class="button" data-i18n="continue"
                    type="submit"></button>
                <p class="feedback" id="booking-feedback" role="status"></p>
                <p class="notice" data-i18n="bookingNotice"></p>
            </form>
            <aside class="booking-aside">
                <div class="table-illustration">和</div>
                <h2>おもてなし</h2>
                <p><span data-i18n="bookingAside"></span></p>
            </aside>
        </section>
    </main>
    <footer class="site-footer">
        <div class="footer-brand">SUSHI SABORES DO MUNDO</div>
        <p data-i18n="footer"></p><a data-i18n="navContact" href="contacto.html"></a><small>© <span id="year"></span>
            Sushi Sabores do Mundo</small>
    </footer><a class="sticky-booking" href="reservas.html"><span>↗</span><b data-i18n="reserve"></b></a>
</body>

</html>
